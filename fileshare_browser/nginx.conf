# FileShare 容器版 nginx：托管 Vue dist + 反代 /api 到后端 Spring Boot(backend:9090)。
# 后端接口全部以 /api 开头，前端 axios 用同源 /api baseURL，故 nginx 保留前缀转发即可。
server {
    listen       80;
    server_name  _;

    charset utf-8;
    # 隐藏版本号，减小信息泄露。
    server_tokens off;

    # 与后端 multipart max-request-size(520MB) 对齐，避免大文件上传被 nginx 拦截。
    client_max_body_size 520m;

    root   /usr/share/nginx/html;
    index  index.html;

    # 接口统一反代 Spring Boot（后端服务名 backend，端口 9090）。
    location /api/ {
        proxy_pass         http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 大文件上传、LibreOffice 转 PDF 等可能较慢，放宽超时。
        proxy_connect_timeout  60s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;
        # 大文件下载/预览流式返回时关闭缓冲更省内存、更顺畅。
        proxy_buffering        off;
        client_max_body_size   520m;
    }

    # Vue History 路由回退。
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
