# FileShare1：静态前端 + /api 反代 Spring Boot
# 1) 后端：application-learn.yml 默认 server.port=9090
# 2) 前端：在 D:/VSC/FileShare1 执行 npm run build 生成 dist
# 3) 修改 root / upstream 路径后 nginx -s reload

upstream fileshare_api {
    server 127.0.0.1:9090;
    keepalive 32;
}

server {
    listen       80;
    # 同时匹配 localhost 与 www.localhost，避免用 www 访问时落到错误站点或触发 DNS 类提示
    server_name  localhost www.localhost 127.0.0.1;

    charset utf-8;

    # 与 Spring multipart max-request-size 对齐（略大一点亦可）
    client_max_body_size 520m;

    # Vue 生产包（History 路由）
    root   D:/VSC/FileShare1/dist;
    index  index.html;

    # 接口统一走 Spring（Cookie Path=/api/share 等与此前端路径一致）
    location /api/ {
        proxy_pass         http://fileshare_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 大文件上传、LibreOffice 转 PDF 等可能较慢
        proxy_connect_timeout  60s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;
        # 大响应时可按需改 on；下载/预览大文件时 off 更省事
        proxy_buffering        off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}
